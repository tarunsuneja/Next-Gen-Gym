name: Gymdesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Server typecheck + tests
        run: npm run check:server
      - name: DB migration tests (PGlite)
        run: npm run test:db
      - name: Build
        run: npm run build

  live:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase
        run: npx supabase start
      - name: Configure environment
        run: |
          source <(npx supabase status -o env | sed 's/^/export /')
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> .env.local
      - name: Run live Supabase tests
        env:
          GYMDESK_TEST_URL: http://127.0.0.1:5173/
        run: |
          npm run dev &
          npx wait-on http://127.0.0.1:5173
          npm run test:live
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-artifacts
          path: tests/artifacts
          retention-days: 7
